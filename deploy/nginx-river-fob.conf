# nginx reverse-proxy vhost for the River FOB Portal (self-hosted on the Droplet).
#
# Hostname: riverfob.jpsi.com  (change the label if you prefer, e.g. fob.jpsi.com —
# keep it identical across the DNS record, the cert, and server_name below).
#
# This file is the PLAIN-HTTP starting point. certbot --nginx reads server_name
# here, obtains a Let's Encrypt cert, and rewrites this file to add the TLS (443)
# server block plus an HTTP->HTTPS redirect. So install this, run certbot, done.
#
#   sudo cp deploy/nginx-river-fob.conf /etc/nginx/sites-available/river-fob
#   sudo ln -s /etc/nginx/sites-available/river-fob /etc/nginx/sites-enabled/river-fob
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d riverfob.jpsi.com      # obtains cert + adds TLS here
#
# Streamlit runs over a websocket: the Upgrade/Connection headers and HTTP/1.1
# below are mandatory, or the page loads then hangs "Connecting…".
#
# NOTE: the `map` below must appear once in the http context. If the existing
# wa.jsa-whatsapp.us vhost already defines `map $http_upgrade $connection_upgrade`,
# nginx will error on the duplicate — in that case delete the map block here and
# reuse the existing one (it's shared across all vhosts).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name riverfob.jpsi.com;        # <-- confirm exact subdomain

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8525;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;         # keep long-lived websockets open
        proxy_send_timeout 3600s;
    }
}
