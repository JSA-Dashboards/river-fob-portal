# nginx reverse-proxy vhost for the River FOB Portal (self-hosted on the Droplet).
#
# Install:
#   sudo cp deploy/nginx-river-fob.conf /etc/nginx/sites-available/river-fob
#   # edit server_name + the two ssl_certificate lines (see below)
#   sudo ln -s /etc/nginx/sites-available/river-fob /etc/nginx/sites-enabled/river-fob
#   sudo nginx -t && sudo systemctl reload nginx
#
# TIP: the box already serves wa.jsa-whatsapp.us over TLS. Copy the `listen 443`
# and `ssl_certificate*` lines from that existing vhost (in
# /etc/nginx/sites-available/) so this reuses the same Cloudflare origin cert and
# TLS setup — then you only change server_name and the proxy_pass port here.
#
# Streamlit runs over a websocket: the `Upgrade`/`Connection` headers and
# HTTP/1.1 below are mandatory, or the page loads and then hangs "Connecting…".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional: redirect plain HTTP to HTTPS (Cloudflare usually does this already).
server {
    listen 80;
    listen [::]:80;
    server_name RIVERFOB_HOST;            # <-- e.g. riverfob.jsa-whatsapp.us
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name RIVERFOB_HOST;            # <-- same host

    # Reuse the box's existing Cloudflare origin cert if it covers this host
    # (a *.jsa-whatsapp.us wildcard does). Otherwise issue a new origin cert in
    # the Cloudflare dashboard for this host and point these at it.
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;   # <-- match wa vhost
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;   # <-- match wa vhost

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8525;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # keep long-lived websockets open
        proxy_send_timeout 3600s;
    }
}
